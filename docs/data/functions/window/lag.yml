name: LAG
summary: Returns a value from a row before the current row in its partition.

syntax:
  sql: LAG(expression [, offset [, default]]) OVER ([PARTITION BY expression [, ...]] [ORDER BY expression [ASC | DESC] [, ...]])
  java: |
    lag($("expression"))
    lag($("expression"), offset)
    lag($("expression"), offset, defaultValue)
  python: |
    lag(col("expression"))
    lag(col("expression"), offset)
    lag(col("expression"), offset, default)

arguments:
  - name: expression
    type: Any type
    required: true
    description: The value to read from the other row.
  - name: offset
    type: An integer
    required: false
    default: "`1`"
    description: How many rows before the current row to look. `0` returns the value of the current row. A negative offset looks the other way, so `LAG(x, -1)` returns the same as `LEAD(x, 1)` in batch mode.
  - name: default
    type: The type of `expression`
    required: false
    default: NULL
    description: The value to return if there is no row at that offset. It is evaluated on the current row. Give it the type of `expression`, such as `CAST(0 AS BIGINT)` for a `BIGINT` expression.

returns:
  description: The value of `expression` in the row that comes `offset` rows before the current row in its partition, by the `ORDER BY` of the window.
  nulls: Returns NULL if that row has a NULL value, or if there is no such row and `default` is NULL or omitted.
  type: The type of `expression`. NOT NULL if `default` is NOT NULL.

notes:
  - The window can't have a frame clause, such as `ROWS BETWEEN 1 PRECEDING AND CURRENT ROW`.
  - Without an `ORDER BY`, the order of the rows is undefined.
  - In streaming mode, the window must be ordered by a time attribute in ascending order.
  - In batch mode, `expression` can't be an `ARRAY`, `MAP`, `ROW` or `VARIANT` value.

see_also:
  - {name: LEAD, ref: window/lead}
  - {name: ROW_NUMBER, ref: window/row-number}

examples:
  - title: Compare each row with its neighbor
    description: "Return the score of the row before each row:"
    sql: |
      SELECT name, score, LAG(score) OVER (ORDER BY score DESC, name) AS neighbor_score
      FROM (VALUES ('Ann', 90), ('Bob', 85), ('Cid', 85), ('Dee', 70)) AS t(name, score)
      ORDER BY score DESC, name;
    result: |
      | name | score | neighbor_score |
      |------|-------|----------------|
      | Ann  | 90    | NULL           |
      | Bob  | 85    | 90             |
      | Cid  | 85    | 85             |
      | Dee  | 70    | 85             |

  - title: An offset and a default
    description: "Look two rows before, and return `0` where there is no such row:"
    sql: |
      SELECT name, score, LAG(score, 2, 0) OVER (ORDER BY score DESC, name) AS two_away
      FROM (VALUES ('Ann', 90), ('Bob', 85), ('Cid', 85), ('Dee', 70)) AS t(name, score)
      ORDER BY score DESC, name;
    result: |
      | name | score | two_away |
      |------|-------|----------|
      | Ann  | 90    | 0        |
      | Bob  | 85    | 0        |
      | Cid  | 85    | 90       |
      | Dee  | 70    | 85       |

  - title: Within each partition
    description: "The rows of one team don't see the rows of another:"
    sql: |
      SELECT team, name, score, LAG(name) OVER (PARTITION BY team ORDER BY score DESC) AS neighbor
      FROM (VALUES ('red', 'Ann', 90), ('red', 'Bob', 85), ('red', 'Cid', 70), ('blue', 'Eve', 95), ('blue', 'Fay', 80)) AS t(team, name, score)
      ORDER BY team, score DESC;
    result: |
      | team | name | score | neighbor |
      |------|------|-------|----------|
      | blue | Eve  | 95    | NULL     |
      | blue | Fay  | 80    | Eve      |
      | red  | Ann  | 90    | NULL     |
      | red  | Bob  | 85    | Ann      |
      | red  | Cid  | 70    | Bob      |
