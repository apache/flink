name: CUME_DIST
summary: Returns the fraction of rows in the partition that come before or tie with the current row.

syntax:
  sql: CUME_DIST() OVER ([PARTITION BY expression [, ...]] ORDER BY expression [ASC | DESC] [, ...])

returns:
  description: The number of rows that come before the current row or are its peers, by the `ORDER BY` of the window, divided by the number of rows in the partition. The value is greater than 0 and at most 1.
  type: "`DOUBLE NOT NULL`."

notes:
  - Peers, rows with equal `ORDER BY` values, get the same value, and they count for each other.
  - The window needs an `ORDER BY`.
  - Not supported in streaming mode.

see_also:
  - {name: PERCENT_RANK, ref: window/percent-rank}
  - {name: NTILE, ref: window/ntile}

examples:
  - title: The cumulative distribution
    description: "Bob and Cid tie, so both count each other:"
    sql: |
      SELECT name, score, CUME_DIST() OVER (ORDER BY score DESC) AS dist
      FROM (VALUES ('Ann', 90), ('Bob', 85), ('Cid', 85), ('Dee', 70)) AS t(name, score)
      ORDER BY dist, name;
    result: |
      | name | score | dist |
      |------|-------|------|
      | Ann  | 90    | 0.25 |
      | Bob  | 85    | 0.75 |
      | Cid  | 85    | 0.75 |
      | Dee  | 70    | 1.0  |
