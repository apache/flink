name: NTILE
summary: Divides the rows of each partition into a number of buckets and returns the bucket of each row.

syntax:
  sql: NTILE(n) OVER ([PARTITION BY expression [, ...]] [ORDER BY expression [ASC | DESC] [, ...]])

arguments:
  - name: n
    type: INT literal
    required: true
    description: The number of buckets. It must be greater than 0.

returns:
  description: The bucket of the current row, from 1 to `n`, in the `ORDER BY` of the window. If the rows don't divide evenly, the first buckets get one row more, so 6 rows in 4 buckets give `1, 1, 2, 2, 3, 4`.
  type: "`BIGINT NOT NULL`."

notes:
  - If `n` is greater than the number of rows, each row gets a bucket of its own, from 1 up.
  - Peers, rows with equal `ORDER BY` values, can land in different buckets.
  - Without an `ORDER BY`, the rows land in the buckets in an undefined order.
  - Not supported in streaming mode.

see_also:
  - {name: ROW_NUMBER, ref: window/row-number}
  - {name: CUME_DIST, ref: window/cume-dist}

examples:
  - title: Split rows into buckets
    description: "Six rows in four buckets. The first two buckets get two rows each:"
    sql: |
      SELECT n, NTILE(4) OVER (ORDER BY n) AS bucket
      FROM (VALUES (1), (2), (3), (4), (5), (6)) AS t(n)
      ORDER BY n;
    result: |
      | n | bucket |
      |---|--------|
      | 1 | 1      |
      | 2 | 1      |
      | 3 | 2      |
      | 4 | 2      |
      | 5 | 3      |
      | 6 | 4      |

  - title: More buckets than rows
    description: "Each row gets a bucket of its own:"
    sql: |
      SELECT n, NTILE(5) OVER (ORDER BY n) AS bucket
      FROM (VALUES (1), (2), (3)) AS t(n)
      ORDER BY n;
    result: |
      | n | bucket |
      |---|--------|
      | 1 | 1      |
      | 2 | 2      |
      | 3 | 3      |
