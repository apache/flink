name: SHA1
summary: Returns the SHA-1 hash of a string as 40 hexadecimal digits.

syntax:
  sql: SHA1(str)
  java: $("str").sha1()
  python: col("str").sha1

arguments:
  - name: str
    type: CHAR, VARCHAR, STRING. In SQL, also BINARY, VARBINARY, BYTES
    required: true
    description: The value to hash.

returns:
  description: The SHA-1 digest of `str` as 40 lower-case hexadecimal digits. A character string is hashed as its UTF-8 bytes, a binary string as its bytes.
  nulls: Returns NULL if `str` is NULL.
  type: "`CHAR(40)`, NOT NULL if `str` is NOT NULL."

see_also:
  - {name: SHA256, ref: hash/sha256}
  - {name: SHA2, ref: hash/sha2}
  - {name: MD5, ref: hash/md5}

examples:
  - title: Hash each string
    description: A NULL string returns NULL.
    sql: |
      SELECT str, SHA1(str) AS `SHA1(str)`
      FROM (VALUES ('Flink'), ('Alice'), (CAST(NULL AS STRING))) AS t(str);
    result: |
      | str   | SHA1(str)                                |
      |-------|------------------------------------------|
      | Flink | 54feb2dfcf78ffe2d2eb82e115831e55a26c774f |
      | Alice | 35318264c9a98faf79965c270ac80c5606774df1 |
      | NULL  | NULL                                     |

  - title: Hash bytes
    description: A string is hashed as its UTF-8 bytes, so `'ä'` and its UTF-8 bytes `X'C3A4'` give the same digest.
    sql: |
      SELECT str, bin, SHA1(str) = SHA1(bin) AS `SHA1(str) = SHA1(bin)`
      FROM (VALUES ('ä', X'C3A4')) AS t(str, bin);
    result: |
      | str | bin     | SHA1(str) = SHA1(bin) |
      |-----|---------|-----------------------|
      | ä   | x'c3a4' | TRUE                  |
