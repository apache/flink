name: SHA224
summary: Returns the SHA-224 hash of a string as 56 hexadecimal digits.

syntax:
  sql: SHA224(str)
  java: $("str").sha224()
  python: col("str").sha224

arguments:
  - name: str
    type: CHAR, VARCHAR, STRING. In SQL, also BINARY, VARBINARY, BYTES
    required: true
    description: The value to hash.

returns:
  description: The SHA-224 digest of `str` as 56 lower-case hexadecimal digits. A character string is hashed as its UTF-8 bytes, a binary string as its bytes.
  nulls: Returns NULL if `str` is NULL.
  type: "`CHAR(56)`, NOT NULL if `str` is NOT NULL."

see_also:
  - {name: SHA2, ref: hash/sha2}
  - {name: SHA256, ref: hash/sha256}
  - {name: SHA384, ref: hash/sha384}

examples:
  - title: Hash each string
    description: A NULL string returns NULL.
    sql: |
      SELECT str, SHA224(str) AS `SHA224(str)`
      FROM (VALUES ('Flink'), ('Alice'), (CAST(NULL AS STRING))) AS t(str);
    result: |
      | str   | SHA224(str)                                              |
      |-------|----------------------------------------------------------|
      | Flink | acf4fcac27bd532190fc4a15d98cf430a32d7e2bef4ef1a904f27ed4 |
      | Alice | 6874ecdbdb214ee888e37c8c983e2f1c9c0ed16907b519704db42bb6 |
      | NULL  | NULL                                                     |

  - title: Hash bytes
    description: A string is hashed as its UTF-8 bytes, so `'ä'` and its UTF-8 bytes `X'C3A4'` give the same digest.
    sql: |
      SELECT str, bin, SHA224(str) = SHA224(bin) AS `SHA224(str) = SHA224(bin)`
      FROM (VALUES ('ä', X'C3A4')) AS t(str, bin);
    result: |
      | str | bin     | SHA224(str) = SHA224(bin) |
      |-----|---------|---------------------------|
      | ä   | x'c3a4' | TRUE                      |
