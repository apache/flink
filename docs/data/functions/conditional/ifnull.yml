name: IFNULL
summary: Returns a replacement if a value is NULL, and the value otherwise.

syntax:
  sql: IFNULL(expr, null_replacement)
  java: $("expr").ifNull(nullReplacement)
  python: col("expr").if_null(null_replacement)

arguments:
  - name: expr
    type: Any type
    required: true
    description: The value to return if it isn't NULL.
  - name: null_replacement
    type: A type that has a common type with `expr`
    required: true
    description: The value to return if `expr` is NULL.

returns:
  description: "`expr` if it isn't NULL, else `null_replacement`."
  nulls: Returns NULL if both arguments are NULL.
  type: The common type of both arguments. NOT NULL if either argument is NOT NULL.

notes:
  - "`IFNULL(expr, null_replacement)` returns the same value as `COALESCE(expr, null_replacement)`."
  - "`null_replacement` is evaluated only if `expr` is NULL."

see_also:
  - {name: COALESCE, ref: conditional/coalesce}
  - {name: NULLIF, ref: conditional/nullif}

examples:
  - title: Replace NULL
    description: Use `'n/a'` where the name is missing.
    sql: |
      SELECT name, IFNULL(name, 'n/a') AS `IFNULL(name, 'n/a')`
      FROM (VALUES ('Alice'), (CAST(NULL AS STRING))) AS t(name);
    result: |
      | name  | IFNULL(name, 'n/a') |
      |-------|---------------------|
      | Alice | Alice               |
      | NULL  | n/a                 |

  - title: The result type
    description: A NOT NULL replacement gives a NOT NULL result, in the common type of both arguments.
    sql: |
      SELECT n, TYPEOF(IFNULL(n, CAST(0 AS BIGINT))) AS `TYPEOF(IFNULL(n, CAST(0 AS BIGINT)))`
      FROM (VALUES (CAST(NULL AS INT))) AS t(n);
    result: |
      | n    | TYPEOF(IFNULL(n, CAST(0 AS BIGINT))) |
      |------|--------------------------------------|
      | NULL | BIGINT NOT NULL                      |
