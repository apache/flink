name: TYPEOF
summary: Returns the data type of an expression as a string.

syntax:
  sql: TYPEOF(expr [, force_serializable])
  java: |
    call("TYPEOF", $("expr"))
    call("TYPEOF", $("expr"), true)
  python: |
    call("TYPEOF", col("expr"))
    call("TYPEOF", col("expr"), True)

arguments:
  - name: expr
    type: Any type
    required: true
    description: The expression whose type to return.
  - name: force_serializable
    type: BOOLEAN literal
    required: false
    default: "`FALSE`"
    description: "`TRUE` returns the full string that can be parsed back into the type, instead of the short one."

returns:
  description: The data type of `expr`, including `NOT NULL` for a type that can't be NULL.
  nulls: Returns NULL if `force_serializable` is `TRUE` and the type has no serializable string, such as `CHAR(0)`, the type of the literal `''`.
  type: "`STRING`, nullable."

notes:
  - The type is computed when the statement is planned, so the rows of one `SELECT` get the same string. The branches of a `UNION ALL` can differ, such as `INT NOT NULL` for `1` and `INT` for `CAST(NULL AS INT)`.
  - "`TYPEOF(NULL)` returns the string `'NULL'`, which a result table shows the same way as a SQL NULL."
  - The short string can omit details that the serializable one keeps, such as `STRING` for `VARCHAR(2147483647)`.

see_also:
  - {name: CAST, ref: cast/cast}

examples:
  - title: Types of literals
    description: A literal is NOT NULL.
    sql: |
      SELECT
        TYPEOF(42) AS `TYPEOF(42)`,
        TYPEOF('abc') AS `TYPEOF('abc')`,
        TYPEOF(1.5) AS `TYPEOF(1.5)`,
        TYPEOF(DATE '2026-01-01') AS `TYPEOF(DATE '2026-01-01')`;
    result: |
      | TYPEOF(42)   | TYPEOF('abc')    | TYPEOF(1.5)            | TYPEOF(DATE '2026-01-01') |
      |--------------|------------------|------------------------|---------------------------|
      | INT NOT NULL | CHAR(3) NOT NULL | DECIMAL(2, 1) NOT NULL | DATE NOT NULL             |

  - title: Columns and aggregates
    description: Return the types of a column and of two aggregates.
    sql: |
      SELECT name,
        TYPEOF(name) AS `TYPEOF(name)`,
        TYPEOF(MAX(score)) AS `TYPEOF(MAX(score))`,
        TYPEOF(COUNT(*)) AS `TYPEOF(COUNT(*))`
      FROM (VALUES ('Alice', 10), ('Bob', 20)) AS t(name, score)
      GROUP BY name;
    result: |
      | name  | TYPEOF(name)        | TYPEOF(MAX(score)) | TYPEOF(COUNT(*)) |
      |-------|---------------------|--------------------|------------------|
      | Alice | VARCHAR(5) NOT NULL | INT NOT NULL       | BIGINT NOT NULL  |
      | Bob   | VARCHAR(5) NOT NULL | INT NOT NULL       | BIGINT NOT NULL  |

  - title: The short and the serializable string
    description: With `force_serializable`, the string spells out the full type.
    sql: |
      SELECT s,
        TYPEOF(s) AS `TYPEOF(s)`,
        TYPEOF(s, TRUE) AS `TYPEOF(s, TRUE)`
      FROM (VALUES (CAST('a' AS STRING))) AS t(s);
    result: |
      | s | TYPEOF(s)       | TYPEOF(s, TRUE)              |
      |---|-----------------|------------------------------|
      | a | STRING NOT NULL | VARCHAR(2147483647) NOT NULL |
