name: PARSE_XML
summary: Parses an XML document into a `VARIANT`, and fails on invalid XML.

syntax:
  sql: PARSE_XML(xml_string [, force_array])
  java: |
    $("xml_string").parseXml()
    $("xml_string").parseXml(forceArray)
  python: |
    col("xml_string").parse_xml()
    col("xml_string").parse_xml(force_array)

arguments:
  - name: xml_string
    type: CHAR, VARCHAR, STRING
    required: true
    description: An XML 1.0 document with one root element.
  - name: force_array
    type: BOOLEAN
    required: false
    default: "`FALSE`"
    description: "`TRUE` stores every child element and text as an array, also one that occurs once."

returns:
  description: A `VARIANT` object with one field, named after the root element. [XML to VARIANT]({{< ref "docs/sql/built-in-functions/variant/xml" >}}#xml-to-variant) describes how elements, attributes and text are stored.
  nulls: Returns NULL if `xml_string` is NULL.
  type: "`VARIANT`, NOT NULL if `xml_string` is NOT NULL."

notes:
  - A document that isn't well-formed XML fails the job, and so does content after the root element. [XML to VARIANT]({{< ref "docs/sql/built-in-functions/variant/xml" >}}#xml-to-variant) lists what else fails. To get NULL instead, use `TRY_PARSE_XML`.

see_also:
  - {name: TRY_PARSE_XML, ref: variant/try-parse-xml}
  - {name: XML_STRING, ref: variant/xml-string}
  - {name: PARSE_JSON, ref: variant/parse-json}

examples:
  - title: Parse an XML document
    description: Attributes get an `@` prefix, and the `#` field records the order of the children.
    sql: |
      SELECT doc, JSON_STRING(PARSE_XML(doc)) AS `JSON_STRING(PARSE_XML(doc))`
      FROM (VALUES ('<book pages="320"><title>Dune</title><price>12.50</price></book>')) AS t(doc);
    result: |
      | doc                                                              | JSON_STRING(PARSE_XML(doc))                                                        |
      |------------------------------------------------------------------|------------------------------------------------------------------------------------|
      | <book pages="320"><title>Dune</title><price>12.50</price></book> | {"book":{"#":{"price":1,"title":0},"@pages":"320","price":"12.50","title":"Dune"}} |

  - title: Read values
    description: Values are strings. Cast a value to `STRING` first, then to the type you need.
    sql: |
      SELECT doc,
        CAST(v['book']['title'] AS STRING) AS `CAST(v['book']['title'] AS STRING)`,
        CAST(CAST(v['book']['@pages'] AS STRING) AS INT) AS `CAST(CAST(v['book']['@pages'] AS STRING) AS INT)`
      FROM (SELECT doc, PARSE_XML(doc) AS v
        FROM (VALUES ('<book pages="320"><title>Dune</title><price>12.50</price></book>')) AS t(doc));
    result: |
      | doc                                                              | CAST(v['book']['title'] AS STRING) | CAST(CAST(v['book']['@pages'] AS STRING) AS INT) |
      |------------------------------------------------------------------|------------------------------------|--------------------------------------------------|
      | <book pages="320"><title>Dune</title><price>12.50</price></book> | Dune                               | 320                                              |

  - title: Repeated elements
    description: An element that repeats becomes an array, and one that doesn't stays a single value.
    sql: |
      SELECT doc,
        JSON_STRING(PARSE_XML(doc)['order']['item']) AS `JSON_STRING(PARSE_XML(doc)['order']['item'])`
      FROM (VALUES
        ('<order><item>pen</item><item>ink</item></order>'),
        ('<order><item>pen</item></order>')) AS t(doc);
    result: |
      | doc                                             | JSON_STRING(PARSE_XML(doc)['order']['item']) |
      |-------------------------------------------------|----------------------------------------------|
      | <order><item>pen</item><item>ink</item></order> | ["pen","ink"]                                |
      | <order><item>pen</item></order>                 | "pen"                                        |

  - title: Force arrays
    description: With `force_array` `TRUE`, both rows have the same shape.
    sql: |
      SELECT doc,
        JSON_STRING(PARSE_XML(doc, TRUE)['order']['item']) AS `JSON_STRING(PARSE_XML(doc, TRUE)['order']['item'])`
      FROM (VALUES
        ('<order><item>pen</item><item>ink</item></order>'),
        ('<order><item>pen</item></order>')) AS t(doc);
    result: |
      | doc                                             | JSON_STRING(PARSE_XML(doc, TRUE)['order']['item']) |
      |-------------------------------------------------|----------------------------------------------------|
      | <order><item>pen</item><item>ink</item></order> | ["pen","ink"]                                      |
      | <order><item>pen</item></order>                 | ["pen"]                                            |
