name: JSON_TYPE
summary: Returns the type of a JSON value, such as `object` or `number`.

syntax:
  sql: JSON_TYPE(json_string [, path])
  java: |
    $("jsonString").jsonType()
    $("jsonString").jsonType(path)
  python: |
    col("json_string").json_type()
    col("json_string").json_type(path)

arguments:
  - name: json_string
    type: CHAR, VARCHAR, STRING
    required: true
    description: The JSON text.
  - name: path
    type: A string literal
    required: false
    default: "`'$'`"
    description: A JSON path without a `lax` or `strict` mode. See [JSON functions]({{< ref "docs/sql/built-in-functions/json" >}}) for the syntax.

returns:
  description: One of `object`, `array`, `string`, `number`, `boolean` or `null`, for the value at `path` or for the whole value. Every number is a `number`, and every quoted value is a `string`, also one such as `"2015-01-01"`.
  nulls: Returns NULL if `json_string` is NULL or isn't valid JSON, or if `path` finds no value or more than one. A JSON `null` returns the string `null`.
  type: "`STRING`, nullable."

notes:
  - A `path` with a `lax` or `strict` mode fails the statement.
  - A `VARIANT` isn't accepted. Write it as JSON text with `JSON_STRING` first.
  - Only the first JSON value is read, and content after it is ignored. So `JSON_TYPE('{"a":1} x')` returns `object`.

see_also:
  - {name: JSON_LENGTH, ref: json/json-length}
  - {name: IS JSON, ref: json/is-json}

examples:
  - title: Type of a JSON value
    description: A quoted value is a `string`, also one that looks like a date.
    sql: |
      SELECT doc, JSON_TYPE(doc) AS `JSON_TYPE(doc)`
      FROM (VALUES ('{"a": true}'), ('[1, 2]'), ('null'), ('true'), ('"2015-01-01"'), ('11.1')) AS t(doc);
    result: |
      | doc          | JSON_TYPE(doc) |
      |--------------|----------------|
      | {"a": true}  | object         |
      | [1, 2]       | array          |
      | null         | null           |
      | true         | boolean        |
      | "2015-01-01" | string         |
      | 11.1         | number         |

  - title: JSON null and SQL NULL
    description: A JSON `null` returns the string `null`. A missing value, invalid JSON and NULL input return NULL.
    sql: |
      SELECT doc, JSON_TYPE(doc, '$.v') AS `JSON_TYPE(doc, '$.v')`
      FROM (VALUES ('{"v": 1}'), ('{"v": "1"}'), ('{"v": [1]}'), ('{"v": null}'), ('{"w": 1}'), ('oops'), (CAST(NULL AS STRING))) AS t(doc);
    result: |
      | doc         | JSON_TYPE(doc, '$.v') |
      |-------------|-----------------------|
      | {"v": 1}    | number                |
      | {"v": "1"}  | string                |
      | {"v": [1]}  | array                 |
      | {"v": null} | null                  |
      | {"w": 1}    | NULL                  |
      | oops        | NULL                  |
      | NULL        | NULL                  |

  - title: A VARIANT
    description: Write a `VARIANT` as JSON text first.
    sql: |
      SELECT JSON_STRING(v) AS `JSON_STRING(v)`,
        JSON_TYPE(JSON_STRING(v), '$.a') AS `JSON_TYPE(JSON_STRING(v), '$.a')`
      FROM (VALUES (PARSE_JSON('{"a": [1]}'))) AS t(v);
    result: |
      | JSON_STRING(v) | JSON_TYPE(JSON_STRING(v), '$.a') |
      |----------------|----------------------------------|
      | {"a":[1]}      | array                            |
