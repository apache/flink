name: JSON_LENGTH
summary: Returns the number of elements of a JSON array or of fields of a JSON object.

syntax:
  sql: JSON_LENGTH(json_string [, path])
  java: |
    $("jsonString").jsonLength()
    $("jsonString").jsonLength(path)
  python: |
    col("json_string").json_length()
    col("json_string").json_length(path)

arguments:
  - name: json_string
    type: CHAR, VARCHAR, STRING, VARIANT
    required: true
    description: The JSON text, or a `VARIANT` such as a result of `PARSE_JSON`.
  - name: path
    type: A string literal
    required: false
    default: "`'$'`"
    description: A JSON path without a `lax` or `strict` mode. See [JSON functions]({{< ref "docs/sql/built-in-functions/json" >}}) for the syntax.

returns:
  description: The number of fields of an object or of elements of an array, at `path` or of the whole value. A scalar has length 1, also a JSON `null`.
  nulls: Returns NULL if `json_string` is NULL or isn't valid JSON, or if `path` finds no value or more than one.
  type: "`INT`, nullable."

notes:
  - A `path` with a `lax` or `strict` mode fails the statement.
  - To tell invalid JSON from a missing value, use `IS JSON`.
  - Only the first JSON value is read, and content after it is ignored. So `JSON_LENGTH('[1,2] x')` returns 2.

see_also:
  - {name: JSON_TYPE, ref: json/json-type}
  - {name: CARDINALITY, ref: collection}

examples:
  - title: Length of a value
    description: An object has the number of its fields, an array the number of its elements, and a scalar 1.
    sql: |
      SELECT doc, JSON_LENGTH(doc) AS `JSON_LENGTH(doc)`
      FROM (VALUES ('{"a": 1, "b": 2}'), ('[1, 2, 3, 4, 5]'), ('"hello"')) AS t(doc);
    result: |
      | doc              | JSON_LENGTH(doc) |
      |------------------|------------------|
      | {"a": 1, "b": 2} | 2                |
      | [1, 2, 3, 4, 5]  | 5                |
      | "hello"          | 1                |

  - title: Length at a path
    description: A path that finds no value returns NULL.
    sql: |
      SELECT doc,
        JSON_LENGTH(doc, '$.a') AS `JSON_LENGTH(doc, '$.a')`,
        JSON_LENGTH(doc, '$.b') AS `JSON_LENGTH(doc, '$.b')`,
        JSON_LENGTH(doc, '$.c') AS `JSON_LENGTH(doc, '$.c')`
      FROM (VALUES ('{"a": [1, 2, 3], "b": {"x": 1, "y": 2}}')) AS t(doc);
    result: |
      | doc                                     | JSON_LENGTH(doc, '$.a') | JSON_LENGTH(doc, '$.b') | JSON_LENGTH(doc, '$.c') |
      |-----------------------------------------|-------------------------|-------------------------|-------------------------|
      | {"a": [1, 2, 3], "b": {"x": 1, "y": 2}} | 3                       | 2                       | NULL                    |

  - title: Each row
    description: Invalid JSON and NULL return NULL.
    sql: |
      SELECT doc,
        JSON_LENGTH(doc) AS `JSON_LENGTH(doc)`,
        JSON_LENGTH(doc, '$.items') AS `JSON_LENGTH(doc, '$.items')`
      FROM (VALUES ('{"items":[1,2,3]}'), ('[]'), ('bad'), (CAST(NULL AS STRING))) AS t(doc);
    result: |
      | doc               | JSON_LENGTH(doc) | JSON_LENGTH(doc, '$.items') |
      |-------------------|------------------|-----------------------------|
      | {"items":[1,2,3]} | 1                | 3                           |
      | []                | 0                | NULL                        |
      | bad               | NULL             | NULL                        |
      | NULL              | NULL             | NULL                        |

  - title: VARIANT input
    description: A `VARIANT` works like JSON text.
    sql: |
      SELECT doc,
        JSON_LENGTH(PARSE_JSON(doc)) AS `JSON_LENGTH(PARSE_JSON(doc))`,
        JSON_LENGTH(PARSE_JSON(doc), '$.a') AS `JSON_LENGTH(PARSE_JSON(doc), '$.a')`
      FROM (VALUES ('[1, 2, 3]'), ('{"a": {"b": 1, "c": 2}}')) AS t(doc);
    result: |
      | doc                     | JSON_LENGTH(PARSE_JSON(doc)) | JSON_LENGTH(PARSE_JSON(doc), '$.a') |
      |-------------------------|------------------------------|-------------------------------------|
      | [1, 2, 3]               | 3                            | NULL                                |
      | {"a": {"b": 1, "c": 2}} | 1                            | 2                                   |
