name: IS JSON
summary: Returns whether a string is valid JSON, optionally of a given kind.

syntax:
  sql: expr IS [NOT] JSON [VALUE | SCALAR | ARRAY | OBJECT]
  java: |
    $("expr").isJson()
    $("expr").isJson(JsonType.OBJECT)
  python: |
    col("expr").is_json()
    col("expr").is_json(JsonType.OBJECT)

arguments:
  - name: expr
    type: CHAR, VARCHAR, STRING
    required: true
    description: The string to test.
  - name: kind
    type: "`VALUE`, `SCALAR`, `ARRAY` or `OBJECT`. In the Table API, `JsonType`"
    required: false
    default: "`VALUE`"
    description: The kind of JSON value to accept. `VALUE` is any JSON value, and `SCALAR` is a string, a number, a boolean or `null`.

returns:
  description: TRUE if `expr` is valid JSON of the given kind, FALSE otherwise. `IS NOT JSON` returns the opposite.
  nulls: Returns NULL if `expr` is NULL, also for `IS NOT JSON`.
  type: "`BOOLEAN`, NOT NULL if `expr` is NOT NULL."

notes:
  - Only the first JSON value is read, and content after it is ignored. So `'{"a":1} xyz' IS JSON` is TRUE.
  - An object with a duplicate key is valid JSON here, although `PARSE_JSON` fails on it by default.

see_also:
  - {name: TRY_PARSE_JSON, ref: variant/try-parse-json}
  - {name: JSON_TYPE, ref: json/json-type}

examples:
  - title: Check whether a string is JSON
    description: Any JSON value returns TRUE, other text returns FALSE, and NULL returns NULL.
    sql: |
      SELECT s,
        s IS JSON AS `s IS JSON`,
        s IS NOT JSON AS `s IS NOT JSON`
      FROM (VALUES ('{"a":1}'), ('[1,2]'), ('42'), ('not json'), (CAST(NULL AS STRING))) AS t(s);
    result: |
      | s        | s IS JSON | s IS NOT JSON |
      |----------|-----------|---------------|
      | {"a":1}  | TRUE      | FALSE         |
      | [1,2]    | TRUE      | FALSE         |
      | 42       | TRUE      | FALSE         |
      | not json | FALSE     | TRUE          |
      | NULL     | NULL      | NULL          |

  - title: Check the kind of JSON value
    description: "`SCALAR`, `ARRAY` and `OBJECT` accept only that kind."
    sql: |
      SELECT s,
        s IS JSON SCALAR AS `s IS JSON SCALAR`,
        s IS JSON ARRAY AS `s IS JSON ARRAY`,
        s IS JSON OBJECT AS `s IS JSON OBJECT`
      FROM (VALUES ('{"a": 1}'), ('[1, 2]'), ('"abc"'), ('abc')) AS t(s);
    result: |
      | s        | s IS JSON SCALAR | s IS JSON ARRAY | s IS JSON OBJECT |
      |----------|------------------|-----------------|------------------|
      | {"a": 1} | FALSE            | FALSE           | TRUE             |
      | [1, 2]   | FALSE            | TRUE            | FALSE            |
      | "abc"    | TRUE             | FALSE           | FALSE            |
      | abc      | FALSE            | FALSE           | FALSE            |

  - title: Keep only JSON objects
    description: Use `IS JSON` in a filter.
    sql: |
      SELECT s
      FROM (VALUES ('{"a":1}'), ('x'), ('[1]')) AS t(s)
      WHERE s IS JSON OBJECT;
    result: |
      | s       |
      |---------|
      | {"a":1} |
