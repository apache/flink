name: JSON_OBJECT
summary: Returns a JSON object built from key-value pairs.

syntax:
  sql: JSON_OBJECT([[KEY] name VALUE expr [, ...]] [{NULL | ABSENT} ON NULL])
  java: jsonObject(JsonOnNull.NULL, name1, expr1, name2, expr2, ...)

arguments:
  - name: name
    type: CHAR, VARCHAR, STRING, NOT NULL. In the Table API, a literal
    required: false
    description: The name of a field.
  - name: expr
    type: Any type that `JSON_STRING` accepts
    required: false
    description: The value of the field, written as `JSON_STRING` writes it.
  - name: ON NULL
    type: "`NULL ON NULL` or `ABSENT ON NULL`. In the Table API, `JsonOnNull.NULL` or `JsonOnNull.ABSENT`"
    required: false
    default: "`NULL ON NULL`"
    description: "`NULL ON NULL` writes a NULL value as `null`. `ABSENT ON NULL` leaves out its field."

returns:
  description: A JSON object with a field for each pair, as a string. Without pairs, `{}`.
  nulls: Never returns NULL.
  type: "`STRING NOT NULL`."

notes:
  - The fields come out sorted by key, not in the order of the pairs. A key that occurs twice keeps its last value.
  - A `JSON_OBJECT`, `JSON_ARRAY` or `JSON` call as the value is inserted as JSON. Any other string is inserted as a JSON string, also the result of `JSON_ARRAYAGG`, `JSON_OBJECTAGG` or `JSON_QUERY`. A `JSON_OBJECT` or `JSON_ARRAY` from a subquery, a view or a `CASE` can come out either way, depending on the query. Wrap a value in `JSON` to always insert it as JSON.
  - "`ON NULL` applies to the values of this call only. NULL values inside an `ARRAY`, a `MAP` or a `ROW` value stay `null`."
  - A comma or a colon can take the place of `VALUE`, such as in `JSON_OBJECT('a', 1)`.

see_also:
  - {name: JSON_ARRAY, ref: json/json-array}
  - {name: JSON, ref: json/json}
  - {name: JSON_OBJECTAGG, ref: aggregate}

examples:
  - title: Build an object
    description: The fields come out sorted by key.
    sql: |
      SELECT name, id,
        JSON_OBJECT('name' VALUE name, 'id' VALUE id) AS `JSON_OBJECT('name' VALUE name, 'id' VALUE id)`,
        JSON_OBJECT() AS `JSON_OBJECT()`
      FROM (VALUES ('Alice', 1)) AS t(name, id);
    result: |
      | name  | id | JSON_OBJECT('name' VALUE name, 'id' VALUE id) | JSON_OBJECT() |
      |-------|----|-----------------------------------------------|---------------|
      | Alice | 1  | {"id":1,"name":"Alice"}                       | {}            |

  - title: NULL values
    description: By default, a NULL value is written as `null`. With `ABSENT ON NULL`, its field is left out.
    sql: |
      SELECT id, name,
        JSON_OBJECT('id' VALUE id, 'name' VALUE name) AS `JSON_OBJECT('id' VALUE id, 'name' VALUE name)`,
        JSON_OBJECT('id' VALUE id, 'name' VALUE name ABSENT ON NULL) AS `JSON_OBJECT('id' VALUE id, 'name' VALUE name ABSENT ON NULL)`
      FROM (VALUES (1, 'Alice'), (2, CAST(NULL AS STRING))) AS t(id, name);
    result: |
      | id | name  | JSON_OBJECT('id' VALUE id, 'name' VALUE name) | JSON_OBJECT('id' VALUE id, 'name' VALUE name ABSENT ON NULL) |
      |----|-------|-----------------------------------------------|--------------------------------------------------------------|
      | 1  | Alice | {"id":1,"name":"Alice"}                       | {"id":1,"name":"Alice"}                                      |
      | 2  | NULL  | {"id":2,"name":null}                          | {"id":2}                                                     |

  - title: Nested objects and arrays
    description: A `JSON_OBJECT` or `JSON_ARRAY` call as a value is inserted as JSON.
    sql: |
      SELECT
        JSON_OBJECT('user' VALUE JSON_OBJECT('name' VALUE 'Alice')) AS `JSON_OBJECT('user' VALUE JSON_OBJECT('name' VALUE 'Alice'))`,
        JSON_OBJECT('tags' VALUE JSON_ARRAY('a', 'b')) AS `JSON_OBJECT('tags' VALUE JSON_ARRAY('a', 'b'))`;
    result: |
      | JSON_OBJECT('user' VALUE JSON_OBJECT('name' VALUE 'Alice')) | JSON_OBJECT('tags' VALUE JSON_ARRAY('a', 'b')) |
      |-------------------------------------------------------------|------------------------------------------------|
      | {"user":{"name":"Alice"}}                                   | {"tags":["a","b"]}                             |

  - title: Values of other types
    description: A date becomes a string, an array an array, and a map an object.
    sql: |
      SELECT d, scores, attrs, active,
        JSON_OBJECT('day' VALUE d, 'scores' VALUE scores, 'attrs' VALUE attrs, 'active' VALUE active) AS `JSON_OBJECT('day' VALUE d, 'scores' VALUE scores, 'attrs' VALUE attrs, 'active' VALUE active)`
      FROM (VALUES (DATE '2024-03-05', ARRAY[1, 2], MAP['color', 'red'], TRUE)) AS t(d, scores, attrs, active);
    result: |
      | d          | scores | attrs       | active | JSON_OBJECT('day' VALUE d, 'scores' VALUE scores, 'attrs' VALUE attrs, 'active' VALUE active) |
      |------------|--------|-------------|--------|-----------------------------------------------------------------------------------------------|
      | 2024-03-05 | [1, 2] | {color=red} | TRUE   | {"active":true,"attrs":{"color":"red"},"day":"2024-03-05","scores":[1,2]}                     |

  - title: JSON text from a column
    description: A string is inserted as a JSON string. Wrap it in `JSON` to insert it as JSON.
    sql: |
      SELECT doc,
        JSON_OBJECT('payload' VALUE doc) AS `JSON_OBJECT('payload' VALUE doc)`,
        JSON_OBJECT('payload' VALUE JSON(doc)) AS `JSON_OBJECT('payload' VALUE JSON(doc))`
      FROM (VALUES ('{"a":1}'), ('[1, 2]')) AS t(doc);
    result: |
      | doc     | JSON_OBJECT('payload' VALUE doc) | JSON_OBJECT('payload' VALUE JSON(doc)) |
      |---------|----------------------------------|----------------------------------------|
      | {"a":1} | {"payload":"{\"a\":1}"}          | {"payload":{"a":1}}                    |
      | [1, 2]  | {"payload":"[1, 2]"}             | {"payload":[1,2]}                      |

  - title: Nest an aggregate
    description: "`JSON_ARRAYAGG` returns a string, so wrap it in `JSON` to insert it as JSON."
    sql: |
      SELECT k,
        JSON_OBJECT('k' VALUE k, 'items' VALUE JSON_ARRAYAGG(n)) AS `JSON_OBJECT('k' VALUE k, 'items' VALUE JSON_ARRAYAGG(n))`,
        JSON_OBJECT('k' VALUE k, 'items' VALUE JSON(JSON_ARRAYAGG(n))) AS `JSON_OBJECT('k' VALUE k, 'items' VALUE JSON(JSON_ARRAYAGG(n)))`
      FROM (VALUES ('a', 1), ('a', 2)) AS t(k, n)
      GROUP BY k;
    result: |
      | k | JSON_OBJECT('k' VALUE k, 'items' VALUE JSON_ARRAYAGG(n)) | JSON_OBJECT('k' VALUE k, 'items' VALUE JSON(JSON_ARRAYAGG(n))) |
      |---|----------------------------------------------------------|----------------------------------------------------------------|
      | a | {"items":"[1,2]","k":"a"}                                | {"items":[1,2],"k":"a"}                                        |
