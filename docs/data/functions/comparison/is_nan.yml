name: IS_NAN
summary: Returns whether a number is NaN, not a number.

syntax:
  sql: IS_NAN(expr)
  java: |
    $("expr").isNan()
    isNan($("expr"))
  python: |
    col("expr").is_nan
    is_nan(col("expr"))

arguments:
  - name: expr
    type: Any numeric type
    required: true
    description: The number to test.

returns:
  description: TRUE if `expr` is a `FLOAT` or `DOUBLE` NaN, FALSE for any other number, including an infinity.
  nulls: Returns NULL if `expr` is NULL.
  type: "`BOOLEAN`, NOT NULL if `expr` is NOT NULL."

notes:
  - To find NaN, use `IS_NAN`. Whether `expr = CAST('NaN' AS DOUBLE)` is TRUE depends on the query.

see_also:
  - {name: Comparison operators, ref: comparison/comparison-operators}

examples:
  - title: Test each row
    description: Only the NaN is NaN. An infinity isn't, and NULL returns NULL.
    sql: |
      SELECT d, IS_NAN(d) AS `IS_NAN(d)`
      FROM (VALUES (CAST('NaN' AS DOUBLE)), (1.5), (CAST('Infinity' AS DOUBLE)), (CAST(NULL AS DOUBLE))) AS t(d);
    result: |
      | d        | IS_NAN(d) |
      |----------|-----------|
      | NaN      | TRUE      |
      | 1.5      | FALSE     |
      | Infinity | FALSE     |
      | NULL     | NULL      |

  - title: NaN from a calculation
    description: "`0.0 / 0.0` is NaN."
    sql: |
      SELECT x, y, IS_NAN(x / y) AS `IS_NAN(x / y)`
      FROM (VALUES (CAST(0.0 AS DOUBLE), CAST(0.0 AS DOUBLE))) AS t(x, y);
    result: |
      | x   | y   | IS_NAN(x / y) |
      |-----|-----|---------------|
      | 0.0 | 0.0 | TRUE          |
