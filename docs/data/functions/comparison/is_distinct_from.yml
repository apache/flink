name: IS DISTINCT FROM
summary: Returns whether two values differ, treating two NULLs as equal.

syntax:
  sql: |
    expr1 IS DISTINCT FROM expr2
    expr1 IS NOT DISTINCT FROM expr2

arguments:
  - name: expr1, expr2
    type: Any two values that `=` can compare
    required: true
    description: The values to compare.

returns:
  description: "`IS DISTINCT FROM` returns FALSE if both values are equal or both are NULL, and TRUE otherwise. `IS NOT DISTINCT FROM` returns the opposite."
  nulls: Never returns NULL.
  type: "`BOOLEAN NOT NULL`."

notes:
  - Use it as a NULL-safe `<>` or `=`. In a join condition, `IS NOT DISTINCT FROM` matches NULL keys with each other.
  - The Table API has no method for `IS DISTINCT FROM`.

see_also:
  - {name: Comparison operators, ref: comparison/comparison-operators}
  - {name: IS NULL, ref: comparison/is-null}

examples:
  - title: NULL values
    description: Two NULLs aren't distinct, and a NULL and a value are.
    sql: |
      SELECT a, b,
        a IS DISTINCT FROM b AS `a IS DISTINCT FROM b`,
        a IS NOT DISTINCT FROM b AS `a IS NOT DISTINCT FROM b`
      FROM (VALUES (1, CAST(NULL AS INT)), (CAST(NULL AS INT), CAST(NULL AS INT)), (1, 1)) AS t(a, b);
    result: |
      | a    | b    | a IS DISTINCT FROM b | a IS NOT DISTINCT FROM b |
      |------|------|----------------------|--------------------------|
      | 1    | NULL | TRUE                 | FALSE                    |
      | NULL | NULL | FALSE                | TRUE                     |
      | 1    | 1    | FALSE                | TRUE                     |

  - title: Keep the rows with NULL
    description: Unlike `status <> 'done'`, this keeps row 3, whose status is NULL.
    sql: |
      SELECT id, status
      FROM (VALUES (1, 'done'), (2, 'open'), (3, CAST(NULL AS STRING))) AS t(id, status)
      WHERE status IS DISTINCT FROM 'done';
    result: |
      | id | status |
      |----|--------|
      | 2  | open   |
      | 3  | NULL   |

  - title: Join on keys that can be NULL
    description: The NULL keys match each other.
    sql: |
      SELECT k1, v1, k2, v2
      FROM (VALUES (1, 'a'), (CAST(NULL AS INT), 'b')) AS l(k1, v1)
      JOIN (VALUES (1, 'x'), (CAST(NULL AS INT), 'y')) AS r(k2, v2)
      ON k1 IS NOT DISTINCT FROM k2;
    result: |
      | k1   | v1 | k2   | v2 |
      |------|----|------|----|
      | 1    | a  | 1    | x  |
      | NULL | b  | NULL | y  |
