name: COS
summary: Returns the cosine of an angle in radians.

syntax:
  sql: COS(x)
  java: $("x").cos()
  python: col("x").cos

arguments:
  - name: x
    type: Any numeric type
    required: true
    description: An angle in radians.

returns:
  description: The cosine of `x`, from -1 to 1.
  nulls: Returns NULL if `x` is NULL.
  type: "`DOUBLE`, NOT NULL if `x` is NOT NULL."

see_also:
  - {name: SIN, ref: mathematical/sin}
  - {name: ACOS, ref: mathematical/acos}
  - {name: RADIANS, ref: mathematical/radians}

examples:
  - title: Cosine of common angles
    description: The result is a `DOUBLE` approximation, so `COS(PI() / 2)` is a tiny number instead of `0`. A NULL angle returns NULL.
    sql: |
      SELECT x, COS(x) AS `COS(x)`
      FROM (VALUES (0.0E0), (PI() / 3), (PI() / 2), (PI()), (CAST(NULL AS DOUBLE))) AS t(x);
    result: |
      | x                  | COS(x)                |
      |--------------------|-----------------------|
      | 0.0                | 1.0                   |
      | 1.0471975511965976 | 0.5000000000000001    |
      | 1.5707963267948966 | 6.123233995736766E-17 |
      | 3.141592653589793  | -1.0                  |
      | NULL               | NULL                  |

  - title: An angle in degrees
    description: Convert degrees to radians with `RADIANS` first. Without it, the number is read as radians.
    sql: |
      SELECT deg, COS(deg) AS `COS(deg)`, COS(RADIANS(deg)) AS `COS(RADIANS(deg))`
      FROM (VALUES (0), (60), (90), (180)) AS t(deg);
    result: |
      | deg | COS(deg)            | COS(RADIANS(deg))     |
      |-----|---------------------|-----------------------|
      | 0   | 1.0                 | 1.0                   |
      | 60  | -0.9524129804151563 | 0.5000000000000001    |
      | 90  | -0.4480736161291702 | 6.123233995736766E-17 |
      | 180 | -0.5984600690578581 | -1.0                  |
