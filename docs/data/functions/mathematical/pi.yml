name: PI
summary: Returns the value of π.

syntax:
  sql: PI()
  java: pi()
  python: pi()

returns:
  description: "`3.141592653589793`, the `DOUBLE` closest to π."
  type: "`DOUBLE NOT NULL`."

see_also:
  - {name: E, ref: mathematical/e}
  - {name: DEGREES, ref: mathematical/degrees}

examples:
  - title: The value of π
    description: "`DEGREES` converts π radians to 180 degrees."
    sql: |
      SELECT PI() AS `PI()`, DEGREES(PI()) AS `DEGREES(PI())`;
    result: |
      | PI()              | DEGREES(PI()) |
      |-------------------|---------------|
      | 3.141592653589793 | 180.0         |

  - title: In a formula
    description: The circumference of a circle with radius `r`.
    sql: |
      SELECT r, 2 * PI() * r AS `2 * PI() * r`
      FROM (VALUES (CAST(1 AS DOUBLE)), (CAST(0.5 AS DOUBLE))) AS t(r);
    result: |
      | r   | 2 * PI() * r      |
      |-----|-------------------|
      | 1.0 | 6.283185307179586 |
      | 0.5 | 3.141592653589793 |
