name: COT
summary: Returns the cotangent of an angle in radians.

syntax:
  sql: COT(x)
  java: $("x").cot()
  python: col("x").cot

arguments:
  - name: x
    type: Any numeric type
    required: true
    description: An angle in radians.

returns:
  description: The cotangent of `x`, which is 1 divided by the tangent of `x`. `COT(0)` is `Infinity`.
  nulls: Returns NULL if `x` is NULL.
  type: "`DOUBLE`, NOT NULL if `x` is NOT NULL."

see_also:
  - {name: TAN, ref: mathematical/tan}
  - {name: RADIANS, ref: mathematical/radians}

examples:
  - title: Cotangent of common angles
    description: At `0`, the result is `Infinity` instead of an error. A NULL angle returns NULL.
    sql: |
      SELECT x, COT(x) AS `COT(x)`
      FROM (VALUES (0.0E0), (PI() / 4), (PI() / 2), (CAST(NULL AS DOUBLE))) AS t(x);
    result: |
      | x                  | COT(x)                |
      |--------------------|-----------------------|
      | 0.0                | Infinity              |
      | 0.7853981633974483 | 1.0000000000000002    |
      | 1.5707963267948966 | 6.123233995736766E-17 |
      | NULL               | NULL                  |
