name: LN
summary: Returns the natural logarithm of a number.

syntax:
  sql: LN(x)
  java: $("x").ln()
  python: col("x").ln

arguments:
  - name: x
    type: Any numeric type
    required: true
    description: The number.

returns:
  description: The logarithm of `x` to the base e. `0` returns `-Infinity`, and a negative `x` returns `NaN`.
  nulls: Returns NULL if `x` is NULL.
  type: "`DOUBLE`, NOT NULL if `x` is NOT NULL."

see_also:
  - {name: LOG, ref: mathematical/log}
  - {name: LOG10, ref: mathematical/log10}
  - {name: EXP, ref: mathematical/exp}

examples:
  - title: Natural logarithms
    description: Zero returns `-Infinity`, a negative number `NaN`, and a NULL value NULL.
    sql: |
      SELECT x, LN(x) AS `LN(x)`
      FROM (VALUES (CAST(1 AS DOUBLE)), (E()), (CAST(10 AS DOUBLE)), (CAST(0 AS DOUBLE)), (CAST(-1 AS DOUBLE)), (CAST(NULL AS DOUBLE))) AS t(x);
    result: |
      | x                 | LN(x)             |
      |-------------------|-------------------|
      | 1.0               | 0.0               |
      | 2.718281828459045 | 1.0               |
      | 10.0              | 2.302585092994046 |
      | 0.0               | -Infinity         |
      | -1.0              | NaN               |
      | NULL              | NULL              |
