name: SINH
summary: Returns the hyperbolic sine of a number.

syntax:
  sql: SINH(x)
  java: $("x").sinh()
  python: col("x").sinh

arguments:
  - name: x
    type: Any numeric type
    required: true
    description: The number.

returns:
  description: The hyperbolic sine of `x`.
  nulls: Returns NULL if `x` is NULL.
  type: "`DOUBLE`, NOT NULL if `x` is NOT NULL."

see_also:
  - {name: COSH, ref: mathematical/cosh}
  - {name: TANH, ref: mathematical/tanh}

examples:
  - title: Hyperbolic sine
    description: A NULL value returns NULL.
    sql: |
      SELECT x, SINH(x) AS `SINH(x)`
      FROM (VALUES (-1), (0), (1), (2), (CAST(NULL AS INT))) AS t(x);
    result: |
      | x    | SINH(x)             |
      |------|---------------------|
      | -1   | -1.1752011936438014 |
      | 0    | 0.0                 |
      | 1    | 1.1752011936438014  |
      | 2    | 3.626860407847019   |
      | NULL | NULL                |
