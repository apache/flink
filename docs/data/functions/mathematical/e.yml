name: E
summary: Returns the value of e, the base of the natural logarithm.

syntax:
  sql: E()
  java: e()
  python: e()

returns:
  description: "`2.718281828459045`, the `DOUBLE` closest to e."
  type: "`DOUBLE NOT NULL`."

see_also:
  - {name: EXP, ref: mathematical/exp}
  - {name: LN, ref: mathematical/ln}
  - {name: PI, ref: mathematical/pi}

examples:
  - title: The value of e
    description: "`LN` of e is `1.0`."
    sql: |
      SELECT E() AS `E()`, LN(E()) AS `LN(E())`;
    result: |
      | E()               | LN(E()) |
      |-------------------|---------|
      | 2.718281828459045 | 1.0     |

  - title: In a formula
    description: Raise e to the power `x`.
    sql: |
      SELECT x, POWER(E(), x) AS `POWER(E(), x)`
      FROM (VALUES (CAST(1 AS DOUBLE)), (CAST(2 AS DOUBLE))) AS t(x);
    result: |
      | x   | POWER(E(), x)      |
      |-----|--------------------|
      | 1.0 | 2.718281828459045  |
      | 2.0 | 7.3890560989306495 |
