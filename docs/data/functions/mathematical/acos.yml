name: ACOS
summary: Returns the arccosine of a number, as an angle in radians.

syntax:
  sql: ACOS(x)
  java: $("x").acos()
  python: col("x").acos

arguments:
  - name: x
    type: Any numeric type
    required: true
    description: The cosine of an angle, from -1 to 1.

returns:
  description: The angle in radians whose cosine is `x`, from 0 to π. A value of `x` outside -1 to 1 returns `NaN`.
  nulls: Returns NULL if `x` is NULL.
  type: "`DOUBLE`, NOT NULL if `x` is NOT NULL."

see_also:
  - {name: COS, ref: mathematical/cos}
  - {name: ASIN, ref: mathematical/asin}
  - {name: DEGREES, ref: mathematical/degrees}

examples:
  - title: Arccosine in radians and degrees
    description: Wrap the result in `DEGREES` to get degrees. A value outside -1 to 1 returns `NaN`, and a NULL value returns NULL.
    sql: |
      SELECT x, ACOS(x) AS `ACOS(x)`, DEGREES(ACOS(x)) AS `DEGREES(ACOS(x))`
      FROM (VALUES (-1.0), (0.0), (0.5), (1.0), (-1.5), (CAST(NULL AS DECIMAL(2, 1)))) AS t(x);
    result: |
      | x    | ACOS(x)            | DEGREES(ACOS(x))  |
      |------|--------------------|-------------------|
      | -1.0 | 3.141592653589793  | 180.0             |
      | 0.0  | 1.5707963267948966 | 90.0              |
      | 0.5  | 1.0471975511965979 | 60.00000000000001 |
      | 1.0  | 0.0                | 0.0               |
      | -1.5 | NaN                | NaN               |
      | NULL | NULL               | NULL              |
