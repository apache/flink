name: MOD
summary: Returns the remainder of dividing one number by another.

syntax:
  sql: |
    MOD(dividend, divisor)
    dividend % divisor
  java: $("dividend").mod(divisor)
  python: col("dividend") % divisor

arguments:
  - name: dividend
    type: An integer type or `DECIMAL`
    required: true
    description: The number to divide.
  - name: divisor
    type: An integer type or `DECIMAL`
    required: true
    description: The number to divide by.

returns:
  description: The remainder of `dividend` divided by `divisor`. It has the sign of `dividend`, so `MOD(-7, 3)` is `-1`.
  nulls: Returns NULL if `dividend` or `divisor` is NULL.
  type: The type of `divisor` if neither argument has decimal places, such as for two integers. Otherwise a `DECIMAL` with the larger of the two scales. NOT NULL if both arguments are NOT NULL.

notes:
  - A `divisor` of zero fails the job.

see_also:
  - {name: Arithmetic operators, ref: mathematical/arithmetic-operators}
  - {name: TRUNCATE, ref: mathematical/truncate}

examples:
  - title: The sign of the remainder
    description: The remainder has the sign of `dividend`. `%` and `MOD` return the same, and a NULL argument returns NULL.
    sql: |
      SELECT a, b, a % b AS `a % b`, MOD(a, b) AS `MOD(a, b)`
      FROM (VALUES (7, 3), (-7, 3), (7, -3), (-7, -3), (6, 3), (7, CAST(NULL AS INT))) AS t(a, b);
    result: |
      | a  | b    | a % b | MOD(a, b) |
      |----|------|-------|-----------|
      | 7  | 3    | 1     | 1         |
      | -7 | 3    | -1    | -1        |
      | 7  | -3   | 1     | 1         |
      | -7 | -3   | -1    | -1        |
      | 6  | 3    | 0     | 0         |
      | 7  | NULL | NULL  | NULL      |

  - title: The remainder of a DECIMAL
    description: The result has the decimal places of the argument with more of them, here `dividend`.
    sql: |
      SELECT a, b, MOD(a, b) AS `MOD(a, b)`, TYPEOF(MOD(a, b)) AS `TYPEOF(MOD(a, b))`
      FROM (VALUES (7.5, 2), (-7.5, 2), (10.25, 3)) AS t(a, b);
    result: |
      | a     | b | MOD(a, b) | TYPEOF(MOD(a, b))      |
      |-------|---|-----------|------------------------|
      | 7.50  | 2 | 1.50      | DECIMAL(4, 2) NOT NULL |
      | -7.50 | 2 | -1.50     | DECIMAL(4, 2) NOT NULL |
      | 10.25 | 3 | 1.25      | DECIMAL(4, 2) NOT NULL |

  - title: Find even numbers
    description: A remainder of `0` when dividing by `2` marks an even number.
    sql: |
      SELECT n, MOD(n, 2) = 0 AS `MOD(n, 2) = 0`
      FROM (VALUES (1), (2), (3), (4)) AS t(n);
    result: |
      | n | MOD(n, 2) = 0 |
      |---|---------------|
      | 1 | FALSE         |
      | 2 | TRUE          |
      | 3 | FALSE         |
      | 4 | TRUE          |
