name: COSH
summary: Returns the hyperbolic cosine of a number.

syntax:
  sql: COSH(x)
  java: $("x").cosh()
  python: col("x").cosh

arguments:
  - name: x
    type: Any numeric type
    required: true
    description: The number.

returns:
  description: The hyperbolic cosine of `x`, 1 or greater.
  nulls: Returns NULL if `x` is NULL.
  type: "`DOUBLE`, NOT NULL if `x` is NOT NULL."

see_also:
  - {name: SINH, ref: mathematical/sinh}
  - {name: TANH, ref: mathematical/tanh}

examples:
  - title: Hyperbolic cosine
    description: A NULL value returns NULL.
    sql: |
      SELECT x, COSH(x) AS `COSH(x)`
      FROM (VALUES (-1), (0), (1), (2), (CAST(NULL AS INT))) AS t(x);
    result: |
      | x    | COSH(x)            |
      |------|--------------------|
      | -1   | 1.543080634815244  |
      | 0    | 1.0                |
      | 1    | 1.543080634815244  |
      | 2    | 3.7621956910836314 |
      | NULL | NULL               |
