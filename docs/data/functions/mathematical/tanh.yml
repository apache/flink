name: TANH
summary: Returns the hyperbolic tangent of a number.

syntax:
  sql: TANH(x)
  java: $("x").tanh()
  python: col("x").tanh

arguments:
  - name: x
    type: Any numeric type
    required: true
    description: The number.

returns:
  description: The hyperbolic tangent of `x`, from -1 to 1.
  nulls: Returns NULL if `x` is NULL.
  type: "`DOUBLE`, NOT NULL if `x` is NOT NULL."

see_also:
  - {name: SINH, ref: mathematical/sinh}
  - {name: COSH, ref: mathematical/cosh}

examples:
  - title: Hyperbolic tangent
    description: For large values of `x`, the result rounds to `1.0`. A NULL value returns NULL.
    sql: |
      SELECT x, TANH(x) AS `TANH(x)`
      FROM (VALUES (-1), (0), (1), (20), (CAST(NULL AS INT))) AS t(x);
    result: |
      | x    | TANH(x)             |
      |------|---------------------|
      | -1   | -0.7615941559557649 |
      | 0    | 0.0                 |
      | 1    | 0.7615941559557649  |
      | 20   | 1.0                 |
      | NULL | NULL                |
