name: SQRT
summary: Returns the square root of a number.

syntax:
  sql: SQRT(x)
  java: $("x").sqrt()
  python: col("x").sqrt

arguments:
  - name: x
    type: Any numeric type
    required: true
    description: The number.

returns:
  description: The square root of `x`. A negative `x` returns `NaN`.
  nulls: Returns NULL if `x` is NULL.
  type: "`DOUBLE`, NOT NULL if `x` is NOT NULL."

see_also:
  - {name: POWER, ref: mathematical/power}

examples:
  - title: Square roots
    description: A negative number returns `NaN`, and a NULL value returns NULL.
    sql: |
      SELECT x, SQRT(x) AS `SQRT(x)`
      FROM (VALUES (4), (2), (0), (-1), (CAST(NULL AS INT))) AS t(x);
    result: |
      | x    | SQRT(x)            |
      |------|--------------------|
      | 4    | 2.0                |
      | 2    | 1.4142135623730951 |
      | 0    | 0.0                |
      | -1   | NaN                |
      | NULL | NULL               |

  - title: Square root of a DECIMAL
    description: The result is a `DOUBLE`, also for a `DECIMAL`.
    sql: |
      SELECT d, SQRT(d) AS `SQRT(d)`, TYPEOF(SQRT(d)) AS `TYPEOF(SQRT(d))`
      FROM (VALUES (CAST(2.25 AS DECIMAL(5, 2))), (CAST(0.01 AS DECIMAL(5, 2)))) AS t(d);
    result: |
      | d    | SQRT(d) | TYPEOF(SQRT(d)) |
      |------|---------|-----------------|
      | 2.25 | 1.5     | DOUBLE NOT NULL |
      | 0.01 | 0.1     | DOUBLE NOT NULL |
