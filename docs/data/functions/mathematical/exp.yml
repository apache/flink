name: EXP
summary: Returns e raised to the power of a number.

syntax:
  sql: EXP(x)
  java: $("x").exp()
  python: col("x").exp

arguments:
  - name: x
    type: Any numeric type
    required: true
    description: The number.

returns:
  description: e raised to the power `x`.
  nulls: Returns NULL if `x` is NULL.
  type: "`DOUBLE`, NOT NULL if `x` is NOT NULL."

see_also:
  - {name: LN, ref: mathematical/ln}
  - {name: POWER, ref: mathematical/power}
  - {name: E, ref: mathematical/e}

examples:
  - title: Powers of e
    description: A large `x` returns `Infinity`, and a NULL value returns NULL.
    sql: |
      SELECT x, EXP(x) AS `EXP(x)`
      FROM (VALUES (0), (1), (-1), (710), (CAST(NULL AS INT))) AS t(x);
    result: |
      | x    | EXP(x)              |
      |------|---------------------|
      | 0    | 1.0                 |
      | 1    | 2.7182818284590455  |
      | -1   | 0.36787944117144233 |
      | 710  | Infinity            |
      | NULL | NULL                |

  - title: EXP undoes LN
    description: "`EXP(LN(x))` returns `x`, up to rounding."
    sql: |
      SELECT x, LN(x) AS `LN(x)`, EXP(LN(x)) AS `EXP(LN(x))`
      FROM (VALUES (CAST(10 AS DOUBLE)), (CAST(0.5 AS DOUBLE))) AS t(x);
    result: |
      | x    | LN(x)               | EXP(LN(x))         |
      |------|---------------------|--------------------|
      | 10.0 | 2.302585092994046   | 10.000000000000002 |
      | 0.5  | -0.6931471805599453 | 0.5                |
