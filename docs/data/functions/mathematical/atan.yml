name: ATAN
summary: Returns the arctangent of a number, as an angle in radians.

syntax:
  sql: ATAN(x)
  java: $("x").atan()
  python: col("x").atan

arguments:
  - name: x
    type: Any numeric type
    required: true
    description: The tangent of an angle.

returns:
  description: The angle in radians whose tangent is `x`, from -π/2 to π/2.
  nulls: Returns NULL if `x` is NULL.
  type: "`DOUBLE`, NOT NULL if `x` is NOT NULL."

notes:
  - To get the angle of a point from its coordinates, use `ATAN2(y, x)`. `ATAN(y / x)` returns the same angle for the points (1, 1) and (-1, -1).

see_also:
  - {name: ATAN2, ref: mathematical/atan2}
  - {name: TAN, ref: mathematical/tan}
  - {name: DEGREES, ref: mathematical/degrees}

examples:
  - title: Arctangent in radians and degrees
    description: Wrap the result in `DEGREES` to get degrees. A NULL value returns NULL.
    sql: |
      SELECT x, ATAN(x) AS `ATAN(x)`, DEGREES(ATAN(x)) AS `DEGREES(ATAN(x))`
      FROM (VALUES (-1), (0), (1), (1000000), (CAST(NULL AS INT))) AS t(x);
    result: |
      | x       | ATAN(x)             | DEGREES(ATAN(x))  |
      |---------|---------------------|-------------------|
      | -1      | -0.7853981633974483 | -45.0             |
      | 0       | 0.0                 | 0.0               |
      | 1       | 0.7853981633974483  | 45.0              |
      | 1000000 | 1.5707953267948966  | 89.99994270422049 |
      | NULL    | NULL                | NULL              |
