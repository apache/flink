name: REGEXP_EXTRACT_ALL
summary: Returns the substrings that a group of a Java regular expression captures in every match.

syntax:
  sql: REGEXP_EXTRACT_ALL(str, regex [, extract_index])
  java: |
    $("str").regexpExtractAll(regex)
    $("str").regexpExtractAll(regex, extractIndex)
  python: |
    col("str").regexp_extract_all(regex)
    col("str").regexp_extract_all(regex, extract_index)

arguments:
  - name: str
    type: CHAR, VARCHAR, STRING
    required: true
    description: The string to search.
  - name: regex
    type: CHAR, VARCHAR, STRING
    required: true
    description: A Java regular expression.
  - name: extract_index
    type: TINYINT, SMALLINT, INT, BIGINT
    required: false
    default: "`1`"
    description: The capturing group to return, starting at 1. `0` returns the whole match.

returns:
  description: An array with one element for each match of `regex` in `str`, in order. Each element is the text that group `extract_index` matched. An empty array if `regex` doesn't match.
  nulls: Returns NULL if any argument is NULL, if `extract_index` is out of range, or if `regex` doesn't compile. An element is NULL if its group took no part in the match, such as the optional group in `'(x)?b'`.
  type: "`ARRAY<STRING>`, nullable."

notes:
  - "`extract_index` defaults to `1`, while it defaults to `0` in `REGEXP_EXTRACT`. A `regex` without groups therefore returns NULL unless you pass `0`."
  - Groups are numbered from 1, in the order of their opening parentheses. `extract_index` is out of range when it is negative or greater than the number of groups in `regex`.
  - "`regex` uses the syntax of `java.util.regex.Pattern`. A backslash is a regular character in a SQL string literal, so write `'\\d'` for a digit."
  - A `regex` that doesn't compile returns NULL, even a literal one.

see_also:
  - {name: REGEXP_EXTRACT, ref: regular-expressions/regexp-extract}
  - {name: REGEXP_COUNT, ref: regular-expressions/regexp-count}
  - {name: SPLIT, ref: string-and-binary}

examples:
  - title: Extract a group from every match
    description: Return the keys and the values of all pairs.
    sql: |
      SELECT str, n,
        REGEXP_EXTRACT_ALL(str, '(\w)=(\d+)', n) AS `REGEXP_EXTRACT_ALL(str, '(\w)=(\d+)', n)`
      FROM (VALUES ('a=1;b=22;c=333', 1), ('a=1;b=22;c=333', 2)) AS t(str, n);
    result: |
      | str            | n | REGEXP_EXTRACT_ALL(str, '(\w)=(\d+)', n) |
      |----------------|---|------------------------------------------|
      | a=1;b=22;c=333 | 1 | [a, b, c]                                |
      | a=1;b=22;c=333 | 2 | [1, 22, 333]                             |

  - title: Extract the whole matches
    description: With `extract_index` `0`, the elements are the whole matches. A regex without groups needs it.
    sql: |
      SELECT str,
        REGEXP_EXTRACT_ALL(str, '\d+', 0) AS `REGEXP_EXTRACT_ALL(str, '\d+', 0)`,
        REGEXP_EXTRACT_ALL(str, '\d+') AS `REGEXP_EXTRACT_ALL(str, '\d+')`
      FROM (VALUES ('a=1;b=22')) AS t(str);
    result: |
      | str      | REGEXP_EXTRACT_ALL(str, '\d+', 0) | REGEXP_EXTRACT_ALL(str, '\d+') |
      |----------|-----------------------------------|--------------------------------|
      | a=1;b=22 | [1, 22]                           | NULL                           |

  - title: No match or a group out of range
    description: A regex that doesn't match returns an empty array. A group out of range returns NULL.
    sql: |
      SELECT str, regex, n,
        REGEXP_EXTRACT_ALL(str, regex, n) AS `REGEXP_EXTRACT_ALL(str, regex, n)`
      FROM (VALUES
        ('a=1;b=22', 'x(\d)', 1),
        ('a=1;b=22', '(\w)=(\d+)', 3),
        ('a=1;b=22', '(\w)=(\d+)', -1)) AS t(str, regex, n);
    result: |
      | str      | regex      | n  | REGEXP_EXTRACT_ALL(str, regex, n) |
      |----------|------------|----|-----------------------------------|
      | a=1;b=22 | x(\d)      | 1  | []                                |
      | a=1;b=22 | (\w)=(\d+) | 3  | NULL                              |
      | a=1;b=22 | (\w)=(\d+) | -1 | NULL                              |

  - title: A group that takes no part in a match
    description: The optional group doesn't match in the first match, so the first element is NULL.
    sql: |
      SELECT str,
        REGEXP_EXTRACT_ALL(str, '(x)?b') AS `REGEXP_EXTRACT_ALL(str, '(x)?b')`
      FROM (VALUES ('b xb')) AS t(str);
    result: |
      | str  | REGEXP_EXTRACT_ALL(str, '(x)?b') |
      |------|----------------------------------|
      | b xb | [NULL, x]                        |

  - title: NULL arguments
    description: A NULL argument returns NULL.
    sql: |
      SELECT str, regex, n,
        REGEXP_EXTRACT_ALL(str, regex, n) AS `REGEXP_EXTRACT_ALL(str, regex, n)`
      FROM (VALUES
        (CAST(NULL AS STRING), '(\w)=(\d+)', 1),
        ('a=1', CAST(NULL AS STRING), 1),
        ('a=1', '(\w)=(\d+)', CAST(NULL AS INT))) AS t(str, regex, n);
    result: |
      | str  | regex      | n    | REGEXP_EXTRACT_ALL(str, regex, n) |
      |------|------------|------|-----------------------------------|
      | NULL | (\w)=(\d+) | 1    | NULL                              |
      | a=1  | NULL       | 1    | NULL                              |
      | a=1  | (\w)=(\d+) | NULL | NULL                              |
