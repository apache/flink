name: "Build legacy documentation"
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build documentation for'
        required: true
        type: choice
        options:
          - release-1.18
          - release-1.17
          - release-1.16
          - release-1.15
          - release-1.14
          - release-1.13
          - release-1.12
          - release-1.11
          - release-1.10
          - release-1.9
          - release-1.8
          - release-1.7
          - release-1.6
          - release-1.5
          - release-1.4
          - release-1.3
          - release-1.2
          - release-1.1
          - release-1.0

jobs:
  build-documentation:
    if: github.repository == 'apache/flink'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Set branch environment variable
        run: |
          echo "flink_branch=${{ inputs.branch }}" >> ${GITHUB_ENV}

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-docs-legacy-${{ inputs.branch }}
          restore-keys: |
            ${{ runner.os }}-maven-docs-legacy-

      - name: Build Jekyll documentation (release-1.12 and earlier)
        if: ${{ contains(fromJSON('["release-1.0", "release-1.1", "release-1.2", "release-1.3", "release-1.4", "release-1.5", "release-1.6", "release-1.7", "release-1.8", "release-1.9", "release-1.10", "release-1.11", "release-1.12"]'), inputs.branch) }}
        run: |
          cd docs/docker
          docker build --rm=true -t flink/docs .
          cd ../..
          docker run --rm \
            -v "$PWD:/flink" \
            -w /flink/docs \
            flink/docs \
            bash -c "./build_docs.sh"

      - name: Build documentation
        # The build runs as root, the upload below as the runner user, hence the chmod
        run: |
          docker run --rm \
            --volume "$PWD:/root/flink" \
            --volume "$HOME/.m2/repository:/root/.m2/repository" \
            apache/flink-ci-docker:java_8_11_17_21_25_maven_386_3916_noble \
            bash -c "apt-get update && apt-get install -y rsync && cd /root/flink && ./.github/workflows/docs.sh && chmod -R a+rX docs/target"

      - name: Upload documentation
        env:
          NIGHTLIES_RSYNC_HOST: ${{ secrets.NIGHTLIES_RSYNC_HOST }}
          NIGHTLIES_RSYNC_KEY: ${{ secrets.NIGHTLIES_RSYNC_KEY }}
          NIGHTLIES_RSYNC_PATH: ${{ secrets.NIGHTLIES_RSYNC_PATH }}
          NIGHTLIES_RSYNC_PORT: ${{ secrets.NIGHTLIES_RSYNC_PORT }}
          NIGHTLIES_RSYNC_USER: ${{ secrets.NIGHTLIES_RSYNC_USER }}
        run: |
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k > /dev/null || true' EXIT
          printf '%s\n' "${NIGHTLIES_RSYNC_KEY}" | ssh-add -
          unset NIGHTLIES_RSYNC_KEY
          rsync --archive --compress --delete --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=no -p ${NIGHTLIES_RSYNC_PORT}" \
            docs/target/ "${NIGHTLIES_RSYNC_USER}@${NIGHTLIES_RSYNC_HOST}:${NIGHTLIES_RSYNC_PATH}/flink/flink-docs-${flink_branch}/"
